
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/game"
  to = "/.netlify/functions/game"
  status = 200
  force = true

[[redirects]]
  from = "/api/creator"
  to = "/.netlify/functions/creator"
  status = 200
  force = true
